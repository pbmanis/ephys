# cochlear_nucleus_alignment.cfg
#
# Configuration for the cochlear_nucleus_alignment tool.
# Read with pyqtgraph.configfile: each value is a Python literal.
#
# User overrides (and remembered preferences) are written to:
#     ~/.config/cn_alignment/cn_alignment.cfg
# which takes precedence over the values below.

# --- Muniak et al. (2013) CN atlas ("ParaView Files" directory) ------------
# First candidate that exists at run time is used (external backups as fallback).
MuniakAtlasRoots: ['/Volumes/Pegasus_004/Tamalpais2/Desktop/Muniak_etal_2013 CNmodel ParaView Files', '/Volumes/Manis26_001/Lytle_M2/Tamalpais2/Desktop/Muniak_etal_2013 CNmodel ParaView Files', '~/Desktop/Muniak_etal_2013 CNmodel ParaView Files']

# --- Kim / Chon (2019) Unified Mouse Brain Atlas (figshare 25750983) --------
# Directory containing the UnifiedAtlas_*.nii volumes and the ontology csv.
KimAtlasRoots: ['/Volumes/Pegasus_004/25750983', '~/Desktop/25750983']
KimLabelFile: 'UnifiedAtlas_Label_v2_20um-isotropic.nii'
KimTemplateFile: 'UnifiedAtlas_template_coronal_20um-isotropic.nii'
KimOntologyFile: 'UnifiedAtlas_Label_ontology_v2.csv'
KimVoxelSize: 20.0

# --- Parsed-mesh cache (so the source drives are only needed once) ---------
CacheDir: '~/.cache/cn_alignment'

# --- Startup defaults ------------------------------------------------------
DefaultAtlas: 'Muniak CN'
DefaultFrame: 'Original'
DefaultColorMode: 'Tonotopic'
SurfaceOpacity: 0.35
